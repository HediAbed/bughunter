name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  check:
    name: fmt, clippy, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${ACTIONLINT_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --status
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint

      - name: Lint workflows
        run: '"${RUNNER_TEMP}/actionlint"'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Format, lint, and test both Cargo manifests
        run: make check

      - name: Release build
        run: cargo build --release --locked

  windows-process:
    name: windows subprocess tree
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Test Windows subprocess cleanup
        run: cargo test --locked --lib process::windows_tests

      - name: Test Windows executable resolution
        run: cargo test --locked --lib llm::claude_cli::tests::windows_

  coverage:
    name: 100% production line and function coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Read the pinned nightly toolchain and cargo-llvm-cov version
        run: |
          printf 'NIGHTLY=%s\n' "$(make --no-print-directory print-nightly)" >> "$GITHUB_ENV"
          printf 'LLVM_COV_VERSION=%s\n' "$(make --no-print-directory print-llvm-cov-version)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: coverage

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --version "$LLVM_COV_VERSION" --locked

      - name: Coverage gate
        run: make coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage
          if-no-files-found: error

  deny:
    name: advisories, licenses, bans, sources (${{ matrix.manifest }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - Cargo.toml
          - fuzz/Cargo.toml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Audit the ${{ matrix.manifest }} dependency graph
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check
          manifest-path: ${{ matrix.manifest }}
